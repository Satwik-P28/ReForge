[package]
name = "reforge-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ReForgeBench Phase 1 semantic core benchmarks"
rust-version.workspace = true

[[bin]]
name = "reforge-bench"
path = "src/main.rs"

[[bin]]
name = "reforgebench_v02"
path = "src/bin/v02.rs"

[[bin]]
name = "reforge_data_runtime"
path = "src/bin/reforge_data_runtime.rs"

[[bench]]
name = "semantic_core"
harness = false

[dependencies]
reforge = { workspace = true }
reforge-investigate = { workspace = true }
reforge-observe = { workspace = true }
reforge-rea = { workspace = true }
reforge-diff = { workspace = true }
reforge-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
