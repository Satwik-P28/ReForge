name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt-clippy-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: export smoke (unix)
        if: matrix.os != 'windows-latest'
        run: cargo test -p reforge --test e2e_export -- --nocapture

  release-prep:
    name: release packaging dry-run
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: build release CLI
        run: cargo build -p reforge-cli --release
      - name: package source checksum placeholder
        run: |
          set -euo pipefail
          mkdir -p dist
          PREFIX="reforge-${GITHUB_SHA:0:12}"
          OUT="dist/${PREFIX}-src.tar.gz"
          git archive --format=tar.gz --prefix="${PREFIX}/" -o "${OUT}" "${GITHUB_SHA}"
          tar -tzf "${OUT}" > /tmp/archive-list.txt
          head -5 /tmp/archive-list.txt
          (cd dist && sha256sum "$(basename "${OUT}")" | tee SHA256SUMS)
          sha256sum -c dist/SHA256SUMS
