<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Board</h1>
      <p id="status" role="status" aria-live="polite">Ready</p>
      <form id="add-form" aria-label="Add task">
        <label for="title">Task title</label>
        <input id="title" name="title" aria-label="Task title" autocomplete="off" />
        <button type="submit" id="add">Add task</button>
      </form>
      <nav aria-label="Filters">
        <button type="button" id="filter-open" class="filter">Show open</button>
        <button type="button" id="filter-all" class="filter">Show all</button>
        <button type="button" id="clear-done">Clear done</button>
      </nav>
      <ul id="tasks" aria-label="Tasks"></ul>
      <p id="count"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
